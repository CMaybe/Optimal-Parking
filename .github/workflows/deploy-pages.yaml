name: deploy-pages

on:
  push:
    branches: ["main"]
    paths:
      - "optimal_parking/**"
      - "example/config.yaml"
      - "web/**"
      - "scripts/build_wasm*.sh"
      - ".github/workflows/deploy-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  WASM_DEPS_PREFIX: ${{ github.workspace }}/.wasm-deps/install
  WASM_DEPS_WORK_DIR: ${{ github.workspace }}/.wasm-deps

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies (Eigen headers, CMake)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeigen3-dev

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Cache wasm dependency build (OSQP, osqp-eigen, yaml-cpp)
        uses: actions/cache@v4
        with:
          path: ${{ env.WASM_DEPS_PREFIX }}
          key: wasm-deps-${{ runner.os }}-${{ hashFiles('scripts/build_wasm_deps.sh') }}

      - name: Build wasm dependencies
        run: ./scripts/build_wasm_deps.sh
        env:
          EIGEN3_CMAKE_DIR: /usr/share/eigen3/cmake

      - name: Build the optimal_parking WASM module
        run: ./scripts/build_wasm.sh
        env:
          EIGEN3_INCLUDE_DIR: /usr/include/eigen3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build the web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
